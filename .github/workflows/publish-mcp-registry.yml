name: Publish to MCP Registry

# Publishes server.json to the official MCP Registry (registry.modelcontextprotocol.io), which feeds
# the GitHub MCP Registry (github.com/mcp). Nothing is built here: it reads the .mcpb and SHA256SUMS.txt
# already attached to the release, stamps version / URL / SHA-256 into server.json, and publishes.
# Auth: GitHub OIDC -> namespace io.github.A-Point-Systems-ltd/*. No secrets.
# Manual run: Actions > Publish to MCP Registry > Run workflow, with the tag. dryRun (default) only validates.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. ext-v1.2.5"
        required: true
        type: string
      dryRun:
        description: "Validate only - do not publish."
        required: false
        default: true
        type: boolean

permissions: {}

concurrency:
  group: publish-mcp-registry
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || (startsWith(github.event.release.tag_name, 'ext-v') && !github.event.release.prerelease) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read   # checkout + download release assets
      id-token: write  # GitHub OIDC login to the MCP Registry
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      TAG_PREFIX: "ext-v"
      DRY_RUN: ${{ inputs.dryRun == true }}
      MCP_PUBLISHER_VERSION: v1.8.8
    steps:
      - uses: actions/checkout@v4

      - name: Stamp server.json from the release .mcpb
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'SHA256SUMS.txt' --dir rel
          mcpb=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name | select(endswith(".mcpb"))')
          [ -n "$mcpb" ] && [ "$(echo "$mcpb" | wc -l)" = "1" ] || { echo "::error::Expected one .mcpb in $TAG, found: $mcpb"; exit 1; }
          sha=$(grep -iF "  $mcpb" rel/SHA256SUMS.txt | awk '{print tolower($1)}')
          [[ "$sha" =~ ^[a-f0-9]{64}$ ]] || { echo "::error::No SHA-256 for $mcpb in SHA256SUMS.txt"; exit 1; }
          version="${TAG#"$TAG_PREFIX"}"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$mcpb"
          jq --arg v "$version" --arg u "$url" --arg s "$sha" \
            '.version = $v | .packages[0].identifier = $u | .packages[0].fileSha256 = $s' server.json > server.tmp
          mv server.tmp server.json
          cat server.json

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Log in (GitHub OIDC)
        if: ${{ env.DRY_RUN != 'true' }}
        run: ./mcp-publisher login github-oidc

      - name: Publish
        if: ${{ env.DRY_RUN != 'true' }}
        run: ./mcp-publisher publish
