name: Publish VS Code Extension

# Manual trigger. Builds the server exe in this workflow, bundles it into the
# extension and publishes to the VS Code Marketplace and Open VSX. The same exe
# is packed as the Claude Desktop extension (.mcpb); both files are uploaded as
# build artifacts and attached to the GitHub release.
# Marketplace versions are irreversible: dryRun defaults to true (package only).
#
# Two jobs. `build` has no environment and no Entra trust; `publish` runs only on
# main, in the `marketplace-publish` environment (deployment branches: main only).
# VS Code Marketplace auth is Microsoft Entra ID via GitHub OIDC — no PAT: global
# Azure DevOps PATs are retired on 1 Dec 2026 and vsce does not accept org-scoped
# ones. App Registration `apoint-vsce-publisher` (no Azure RBAC roles) has a
# federated credential for subject
#   repo:A-Point-Systems-ltd/ms-sql-mcp:environment:marketplace-publish
# and is a Contributor member of Marketplace publisher `apoint`.
#   vars.VSCE_AZURE_CLIENT_ID - environment variable on marketplace-publish
# Required repo secret: OVSX_PAT (Open VSX namespace "apoint").
# A dry run on main still logs in and runs `vsce verify-pat`, which checks the
# Marketplace auth end to end without publishing.

on:
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Package only - do not publish to the marketplaces."
        required: false
        default: true
        type: boolean

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
      vsix: ${{ steps.ver.outputs.vsix }}
      mcpb: ${{ steps.ver.outputs.mcpb }}
    defaults:
      run:
        working-directory: vscode-extension
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Real publish only from main
        if: ${{ inputs.dryRun == false && github.ref != 'refs/heads/main' }}
        shell: bash
        run: |
          echo "::error::dryRun=false is allowed only on refs/heads/main (this run is on ${{ github.ref }}). Re-run on main or keep dryRun=true."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Check versions are in sync
        run: npm run check:version

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build connections view (embedded in the exe)
        working-directory: apps/connections-ui
        run: |
          npm ci
          npm test
          npm run build

      # A cold LocalDB instance can take longer to start than the tests' 15 s connect timeout; with dozens of
      # parallel tests queued on one pool, that failed runs with "timeout obtaining a connection from the pool".
      - name: Start LocalDB
        working-directory: .
        shell: pwsh
        run: |
          sqllocaldb start MSSQLLocalDB
          if ($LASTEXITCODE -ne 0) { sqllocaldb create MSSQLLocalDB -s }
          if ($LASTEXITCODE -ne 0) { throw "Could not start LocalDB (exit $LASTEXITCODE)." }
          sqllocaldb info MSSQLLocalDB

      - name: Server tests
        working-directory: .
        run: dotnet test MssqlMcp.sln -c Release

      - name: Publish server (single-file exe)
        working-directory: .
        run: dotnet publish MssqlMcp/MssqlMcp.csproj -c Release -p:PublishProfile=ReleaseSingleFile "-p:PublishDir=${{ runner.temp }}/exe/"

      - name: Stage exe (SHA-256 recorded and verified)
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'exe/MssqlMcp.exe'
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          Write-Host "MssqlMcp.exe sha256: $hash"
          node scripts/stage-exe.mjs $exe --sha256 $hash
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Read extension version
        id: ver
        shell: pwsh
        run: |
          $v = node -p "require('./package.json').version"
          "version=$v" >> $env:GITHUB_OUTPUT
          "vsix=ms-sql-mcp-win32-x64-$v.vsix" >> $env:GITHUB_OUTPUT
          "mcpb=apoint-ms-sql-$v.mcpb" >> $env:GITHUB_OUTPUT

      - name: Unit tests
        run: npm run test:unit

      # Packs the exe staged above (the one the server tests ran against), so the VSIX and the .mcpb carry the same build.
      - name: Package Claude Desktop extension (.mcpb)
        working-directory: .
        shell: pwsh
        run: |
          ./packaging/mcpb/build-mcpb.ps1 -ExePath (Join-Path $env:RUNNER_TEMP 'exe/MssqlMcp.exe') -OutDir (Join-Path $env:RUNNER_TEMP 'mcpb')
          $bundle = Join-Path $env:RUNNER_TEMP 'mcpb/${{ steps.ver.outputs.mcpb }}'
          if (-not (Test-Path -LiteralPath $bundle)) { throw "Expected $bundle" }

      - name: Upload .mcpb as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: apoint-ms-sql-mcpb
          path: ${{ runner.temp }}/mcpb/${{ steps.ver.outputs.mcpb }}

      - name: Package (win32-x64)
        run: npx vsce package --target win32-x64 -o "${{ steps.ver.outputs.vsix }}"

      - name: Upload VSIX as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ms-sql-mcp-vsix
          path: vscode-extension/${{ steps.ver.outputs.vsix }}

  publish:
    needs: build
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: windows-latest
    # The Entra federated credential's subject is bound to this environment, which
    # allows deployments from main only — this repo is public, so no fork or PR
    # branch can obtain the Marketplace identity.
    environment: marketplace-publish
    permissions:
      contents: write # "Create GitHub release"
      id-token: write # GitHub OIDC token for the Entra (Marketplace) login
    defaults:
      run:
        working-directory: vscode-extension
    env:
      GH_TOKEN: ${{ github.token }}
      VSIX: ${{ needs.build.outputs.vsix }}
      MCPB: ${{ needs.build.outputs.mcpb }}
    steps:
      # Checkout + npm ci so vsce and ovsx come from the lockfile.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          name: ms-sql-mcp-vsix
          path: vscode-extension

      - name: Download .mcpb
        uses: actions/download-artifact@v4
        with:
          name: apoint-ms-sql-mcpb
          path: ${{ runner.temp }}/mcpb

      # allow-no-subscriptions: the identity deliberately has no Azure role; vsce
      # only needs an Azure DevOps token, requested through this Azure CLI session.
      - name: Azure login (OIDC) for the Marketplace
        uses: azure/login@v2
        with:
          tenant-id: ${{ vars.AZURE_TENANT_ID || 'ac1d1e04-438d-414b-a9dc-bcf081cfd12e' }}
          client-id: ${{ vars.VSCE_AZURE_CLIENT_ID }}
          allow-no-subscriptions: true

      # Runs on dry runs too: fails here, with nothing shipped, if the identity is
      # not (or no longer) a member of the publisher.
      - name: Verify Marketplace publish rights
        run: npx vsce verify-pat --azure-credential apoint

      - name: Publish to VS Code Marketplace
        if: ${{ inputs.dryRun == false }}
        run: npx vsce publish --azure-credential --packagePath "$env:VSIX"

      - name: Publish to Open VSX
        if: ${{ inputs.dryRun == false }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish "$env:VSIX"

      - name: Create GitHub release
        if: ${{ inputs.dryRun == false }}
        run: gh release create "ext-v${{ needs.build.outputs.version }}" "$env:VSIX" "${{ runner.temp }}/mcpb/$env:MCPB" --title "Extension v${{ needs.build.outputs.version }}" --target ${{ github.sha }} --generate-notes
